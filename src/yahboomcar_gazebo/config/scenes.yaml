# Scene definitions for the scene_switcher node.
#
# Each scene is a named list of objects. The node spawns them via
# /spawn_entity and removes the previous scene via /delete_entity, so you can
# hot-swap environments at runtime without restarting Gazebo:
#
#   ros2 topic pub --once /scene_cmd std_msgs/String "data: warehouse"
#   ros2 service call /scene/next  std_srvs/srv/Trigger
#   ros2 service call /scene/clear std_srvs/srv/Trigger
#
# Each list item is one object. Supported forms:
#   {box:      [sx, sy, sz],     pose: [...], color: [r,g,b]}
#   {cylinder: [radius, length], pose: [...], color: [r,g,b]}
#   {sphere:   [radius],         pose: [...], color: [r,g,b]}
#   {model:    <gazebo_model_name>, pose: [...]}     # model:// include
#
# pose  = [x, y, z, roll, pitch, yaw]  (metres / radians, world frame).
#         For a box/cylinder resting on the floor set z = height / 2.
# color = [r, g, b] in 0..1 (optional, defaults to grey).
#
# Primitives are used by default because they need no model download and work
# offline. `model:` entries (e.g. cafe_table, bookshelf) only work if those
# assets are available locally / via Fuel.

scenes:

  office:
    - {box: [0.8, 0.8, 0.4],  pose: [2.0,  0.0, 0.20, 0, 0, 0],    color: [0.5, 0.3, 0.1]}
    - {box: [0.8, 0.8, 0.4],  pose: [2.0,  2.0, 0.20, 0, 0, 0],    color: [0.5, 0.3, 0.1]}
    - {box: [0.3, 1.6, 1.0],  pose: [3.5,  1.0, 0.50, 0, 0, 0],    color: [0.55, 0.4, 0.25]}
    - {box: [0.4, 0.4, 0.4],  pose: [1.2, -1.2, 0.20, 0, 0, 0],    color: [0.8, 0.7, 0.4]}

  warehouse:
    - {box: [0.4, 2.0, 1.2],  pose: [2.5,  1.2, 0.60, 0, 0, 0],    color: [0.55, 0.4, 0.25]}
    - {box: [0.4, 2.0, 1.2],  pose: [2.5, -1.2, 0.60, 0, 0, 0],    color: [0.55, 0.4, 0.25]}
    - {box: [0.5, 0.5, 0.5],  pose: [3.5,  0.0, 0.25, 0, 0, 0],    color: [0.8, 0.7, 0.4]}
    - {box: [0.5, 0.5, 0.5],  pose: [4.0,  0.6, 0.25, 0, 0, 0],    color: [0.8, 0.7, 0.4]}
    - {box: [0.5, 0.5, 0.5],  pose: [4.0, -0.6, 0.25, 0, 0, 0],    color: [0.8, 0.7, 0.4]}

  obstacles:
    - {cylinder: [0.18, 0.5], pose: [1.5,  0.6, 0.25, 0, 0, 0],    color: [0.9, 0.4, 0.0]}
    - {cylinder: [0.18, 0.5], pose: [1.5, -0.6, 0.25, 0, 0, 0],    color: [0.9, 0.4, 0.0]}
    - {cylinder: [0.18, 0.5], pose: [2.5,  0.0, 0.25, 0, 0, 0],    color: [0.9, 0.4, 0.0]}
    - {cylinder: [0.25, 0.9], pose: [3.5,  0.8, 0.45, 0, 0, 0],    color: [0.85, 0.1, 0.1]}
    - {cylinder: [0.25, 0.9], pose: [3.5, -0.8, 0.45, 0, 0, 0],    color: [0.85, 0.1, 0.1]}

  parking:
    - {box: [2.0, 0.2, 0.5],  pose: [2.0,  1.5, 0.25, 0, 0, 0],    color: [0.9, 0.9, 0.9]}
    - {box: [2.0, 0.2, 0.5],  pose: [2.0, -1.5, 0.25, 0, 0, 0],    color: [0.9, 0.9, 0.9]}
    - {box: [0.2, 3.0, 0.5],  pose: [4.0,  0.0, 0.25, 0, 0, 0],    color: [0.9, 0.9, 0.9]}
