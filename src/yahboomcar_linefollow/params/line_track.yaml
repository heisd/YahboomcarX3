line_track:
  ros__parameters:
    camera_index: 0
    frame_width: 640
    frame_height: 480

    # Look at a horizontal band in the lower part of the image.
    roi_top_ratio: 0.65
    roi_bottom_ratio: 1.0

    # Motion limits
    linear: 0.15           # m/s forward
    angular_max: 1.2       # rad/s clamp

    # PID on normalized lateral error in [-1, 1]
    kp: 1.6
    ki: 0.0
    kd: 0.4

    show_window: true      # set false on a headless robot
    switch: true           # master enable
